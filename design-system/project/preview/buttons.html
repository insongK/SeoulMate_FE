<!doctype html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div class="row" style="gap:12px;flex-wrap:wrap">
    <button style="height:48px;padding:0 22px;border:none;border-radius:14px;background:linear-gradient(135deg,#F5A623 0%,#E8547A 100%);color:#1A1A1A;font-family:inherit;font-weight:700;font-size:15px;letter-spacing:.02em;cursor:pointer;box-shadow:0 4px 18px rgba(245,166,35,.35)">코스 추천 받기</button>
    <button style="height:48px;padding:0 22px;border:1.5px solid rgba(245,166,35,.4);border-radius:14px;background:transparent;color:#F5A623;font-family:inherit;font-weight:600;font-size:15px;cursor:pointer">자세히 보기</button>
    <button style="height:48px;padding:0 22px;border:1px solid rgba(255,255,255,.09);border-radius:14px;background:rgba(255,255,255,.05);color:#FFFFFF;font-family:inherit;font-weight:500;font-size:15px;cursor:pointer">취소</button>
    <button style="height:48px;padding:0 22px;border:none;border-radius:14px;background:rgba(255,255,255,.05);color:#6E6E6E;font-family:inherit;font-weight:600;font-size:15px;cursor:not-allowed">비활성</button>
  </div>
  <div class="row" style="gap:10px">
    <button style="height:36px;padding:0 14px;border:none;border-radius:10px;background:linear-gradient(135deg,#F5A623,#E8547A);color:#1A1A1A;font-family:inherit;font-weight:700;font-size:13px;cursor:pointer">저장</button>
    <button style="height:36px;padding:0 14px;border:1px solid rgba(255,255,255,.12);border-radius:10px;background:transparent;color:#FFFFFF;font-family:inherit;font-weight:500;font-size:13px;cursor:pointer">공유</button>
    <button style="height:36px;width:36px;border:1px solid rgba(255,255,255,.09);border-radius:10px;background:rgba(255,255,255,.04);color:#FFFFFF;cursor:pointer;display:flex;align-items:center;justify-content:center">♡</button>
  </div>
</div>
</body></html>
