<!doctype html><html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type_light.css">
<style>
body{margin:0;background:var(--bg);font-family:var(--font-sans);color:var(--fg)}
.card{width:700px;padding:28px;display:flex;flex-direction:column;gap:18px;box-sizing:border-box}
.row{display:flex;gap:12px;flex-wrap:wrap}
button{font-family:inherit;cursor:pointer}
</style></head>
<body>
<div class="card">
  <div class="row">
    <button style="height:48px;padding:0 22px;border:none;border-radius:14px;background:linear-gradient(135deg,#F5A623,#E8547A);color:#1F1A14;font-weight:700;font-size:15px;box-shadow:0 6px 22px rgba(245,166,35,.30)">코스 추천 받기</button>
    <button style="height:48px;padding:0 22px;border:1.5px solid rgba(245,166,35,.45);border-radius:14px;background:transparent;color:#C8830F;font-weight:600;font-size:15px">자세히 보기</button>
    <button style="height:48px;padding:0 22px;border:1px solid rgba(31,26,20,.10);border-radius:14px;background:#FFFFFF;color:#1F1A14;font-weight:500;font-size:15px">취소</button>
  </div>
  <div style="display:flex;gap:14px">
    <div style="flex:1;background:#FFFFFF;border:1px solid rgba(31,26,20,.08);border-radius:20px;padding:18px;box-shadow:0 8px 24px rgba(180,120,60,.08),0 2px 6px rgba(180,120,60,.06);display:flex;gap:14px">
      <div style="width:88px;height:88px;border-radius:14px;flex-shrink:0;background-image:url('../assets/seoul-autumn.png');background-size:cover;background-position:center"></div>
      <div style="flex:1;display:flex;flex-direction:column;gap:6px">
        <div style="display:flex;gap:8px;align-items:center"><span style="padding:4px 10px;border-radius:9999px;background:rgba(245,166,35,.14);color:#C8830F;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase">AI 추천</span><span style="font-size:12px;color:#6B6258">· 4시간</span></div>
        <div style="font-size:17px;font-weight:700">남산 단풍 산책</div>
        <div style="font-size:13px;color:#6B6258">남산 → 명동 · 3 곳</div>
        <div style="display:flex;justify-content:space-between;align-items:center"><span style="font-family:var(--font-mono);font-size:13px">₩42,000 / 인</span><span style="padding:4px 10px;border-radius:9999px;background:rgba(46,168,107,.14);color:#2EA86B;font-size:11px;font-weight:700">● 여유</span></div>
      </div>
    </div>
  </div>
  <div class="row" style="gap:8px">
    <div style="padding:10px 16px;border-radius:9999px;background:linear-gradient(135deg,#F5A623,#E8547A);color:#1F1A14;font-weight:700;font-size:13px">로맨틱</div>
    <div style="padding:10px 16px;border-radius:9999px;background:#FFFFFF;border:1px solid rgba(31,26,20,.16);color:#1F1A14;font-weight:500;font-size:13px">감성</div>
    <div style="padding:10px 16px;border-radius:9999px;background:#FFFFFF;border:1px solid rgba(31,26,20,.16);color:#1F1A14;font-weight:500;font-size:13px">단풍</div>
    <div style="padding:10px 16px;border-radius:9999px;background:rgba(245,166,35,.14);border:1px solid rgba(245,166,35,.45);color:#C8830F;font-weight:700;font-size:13px">야경</div>
  </div>
</div>
</body></html>
