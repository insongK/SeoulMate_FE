<!doctype html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div class="row" style="gap:14px">
    <div class="swatch">
      <div class="chip" style="height:96px;background:linear-gradient(135deg,#F5A623 0%,#E8547A 100%);border-color:transparent"></div>
      <div class="name">Amber → Pink</div>
      <div class="meta">--grad-amber · CTA fills</div>
    </div>
    <div class="swatch">
      <div class="chip" style="height:96px;background:linear-gradient(135deg,#FFC56B 0%,#F5A623 45%,#E8547A 100%);border-color:transparent"></div>
      <div class="name">Sunrise</div>
      <div class="meta">--grad-sunrise · hero accent</div>
    </div>
  </div>
  <div class="row">
    <div class="swatch" style="flex:2">
      <div class="chip" style="height:96px;background-image:url('../assets/seoul-bg.jpg');background-size:cover;background-position:center;position:relative;border-color:transparent">
        <div style="position:absolute;inset:0;background:linear-gradient(0deg,rgba(13,13,13,.95) 0%,rgba(13,13,13,0) 60%)"></div>
      </div>
      <div class="name">Skyline Protection</div>
      <div class="meta">--grad-skyline · over imagery</div>
    </div>
    <div class="swatch">
      <div class="chip" style="height:96px;background:linear-gradient(180deg,#0D0D0D 0%,#1A1A1A 100%);border-color:transparent"></div>
      <div class="name">Night</div>
      <div class="meta">--grad-night · page bg</div>
    </div>
  </div>
</div>
</body></html>
