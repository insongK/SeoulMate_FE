<!doctype html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card" style="background:var(--bg)">
  <div class="row">
    <div class="swatch">
      <div class="chip" style="background:#FFFFFF"></div>
      <div class="name">Text Primary</div>
      <div class="meta">--fg · #FFFFFF</div>
    </div>
    <div class="swatch">
      <div class="chip" style="background:#A0A0A0"></div>
      <div class="name">Text Secondary</div>
      <div class="meta">--fg-2 · #A0A0A0</div>
    </div>
    <div class="swatch">
      <div class="chip" style="background:#6E6E6E"></div>
      <div class="name">Text Muted</div>
      <div class="meta">--fg-3 · #6E6E6E</div>
    </div>
    <div class="swatch">
      <div class="chip" style="background:#4A4A4A"></div>
      <div class="name">Text Disabled</div>
      <div class="meta">--fg-4 · #4A4A4A</div>
    </div>
  </div>
  <div style="background:var(--surface);border-radius:14px;padding:18px 20px;display:flex;flex-direction:column;gap:6px">
    <div style="font-size:18px;font-weight:700;color:#FFFFFF">서울에서의 특별한 하루</div>
    <div style="font-size:14px;color:#A0A0A0">강남, 연남, 성수까지 — 분위기에 맞는 코스를 추천해드려요</div>
    <div style="font-size:12px;color:#6E6E6E">· 평균 소요 시간 4시간 30분</div>
  </div>
</div>
</body></html>
