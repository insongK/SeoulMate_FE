<!doctype html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div class="row" style="gap:8px;flex-wrap:wrap">
    <div style="padding:10px 16px;border-radius:9999px;background:linear-gradient(135deg,#F5A623,#E8547A);color:#1A1A1A;font-weight:700;font-size:13px">로맨틱</div>
    <div style="padding:10px 16px;border-radius:9999px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.10);color:#FFFFFF;font-weight:500;font-size:13px">감성</div>
    <div style="padding:10px 16px;border-radius:9999px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.10);color:#FFFFFF;font-weight:500;font-size:13px">활동적</div>
    <div style="padding:10px 16px;border-radius:9999px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.10);color:#FFFFFF;font-weight:500;font-size:13px">조용한</div>
    <div style="padding:10px 16px;border-radius:9999px;background:rgba(245,166,35,.12);border:1px solid rgba(245,166,35,.4);color:#F5A623;font-weight:600;font-size:13px">야경</div>
  </div>
  <div class="row" style="gap:8px">
    <div style="padding:6px 12px;border-radius:9999px;background:rgba(52,199,123,.12);color:#34C77B;font-size:12px;font-weight:600">● 여유</div>
    <div style="padding:6px 12px;border-radius:9999px;background:rgba(245,166,35,.14);color:#F5A623;font-size:12px;font-weight:600">● 보통</div>
    <div style="padding:6px 12px;border-radius:9999px;background:rgba(232,84,122,.14);color:#E8547A;font-size:12px;font-weight:600">● 혼잡</div>
    <div style="padding:6px 12px;border-radius:9999px;background:rgba(245,166,35,.10);color:#F5A623;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase">AI 추천</div>
    <div style="padding:6px 12px;border-radius:9999px;background:rgba(255,255,255,.06);color:#FFFFFF;font-size:12px;font-weight:500">· 2.4 km</div>
  </div>
</div>
</body></html>
