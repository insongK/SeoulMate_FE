<!doctype html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div style="background:#0D0D0D;border-top:1px solid rgba(255,255,255,.06);padding:10px 16px 18px;display:flex;justify-content:space-around;align-items:center">
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px;color:#F5A623">
      <div style="width:24px;height:24px;border-radius:6px;background:rgba(245,166,35,.18);display:flex;align-items:center;justify-content:center"><div style="width:10px;height:10px;background:#F5A623;border-radius:2px"></div></div>
      <div style="font-size:11px;font-weight:600">홈</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px;color:#A0A0A0">
      <div style="width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center"><div style="width:14px;height:14px;border:1.5px solid #A0A0A0;border-radius:50%"></div></div>
      <div style="font-size:11px;font-weight:500">탐색</div>
    </div>
    <div style="position:relative;margin-top:-22px">
      <div style="width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#F5A623,#E8547A);display:flex;align-items:center;justify-content:center;color:#1A1A1A;font-size:24px;font-weight:900;box-shadow:0 8px 24px rgba(245,166,35,.45)">+</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px;color:#A0A0A0">
      <div style="width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center"><div style="width:14px;height:12px;border:1.5px solid #A0A0A0;border-radius:2px"></div></div>
      <div style="font-size:11px;font-weight:500">히스토리</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px;color:#A0A0A0">
      <div style="width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center"><div style="width:12px;height:12px;border:1.5px solid #A0A0A0;border-radius:50%"></div></div>
      <div style="font-size:11px;font-weight:500">프로필</div>
    </div>
  </div>
</div>
</body></html>
