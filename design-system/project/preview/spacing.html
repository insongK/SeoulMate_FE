<!doctype html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div class="row" style="gap:12px">
    <div class="col" style="align-items:center;flex:1"><div style="width:4px;height:4px;background:#F5A623;border-radius:9999px"></div><div style="font-family:'JetBrains Mono',monospace;font-size:10px;color:#A0A0A0">4 · --space-1</div></div>
    <div class="col" style="align-items:center;flex:1"><div style="width:8px;height:8px;background:#F5A623;border-radius:9999px"></div><div style="font-family:'JetBrains Mono',monospace;font-size:10px;color:#A0A0A0">8 · --space-2</div></div>
    <div class="col" style="align-items:center;flex:1"><div style="width:12px;height:12px;background:#F5A623;border-radius:9999px"></div><div style="font-family:'JetBrains Mono',monospace;font-size:10px;color:#A0A0A0">12 · --space-3</div></div>
    <div class="col" style="align-items:center;flex:1"><div style="width:16px;height:16px;background:#F5A623;border-radius:9999px"></div><div style="font-family:'JetBrains Mono',monospace;font-size:10px;color:#A0A0A0">16 · --space-4</div></div>
    <div class="col" style="align-items:center;flex:1"><div style="width:24px;height:24px;background:#F5A623;border-radius:9999px"></div><div style="font-family:'JetBrains Mono',monospace;font-size:10px;color:#A0A0A0">24 · --space-6</div></div>
    <div class="col" style="align-items:center;flex:1"><div style="width:32px;height:32px;background:#F5A623;border-radius:9999px"></div><div style="font-family:'JetBrains Mono',monospace;font-size:10px;color:#A0A0A0">32 · --space-8</div></div>
    <div class="col" style="align-items:center;flex:1"><div style="width:48px;height:48px;background:#F5A623;border-radius:9999px"></div><div style="font-family:'JetBrains Mono',monospace;font-size:10px;color:#A0A0A0">48 · --space-12</div></div>
    <div class="col" style="align-items:center;flex:1"><div style="width:64px;height:64px;background:#F5A623;border-radius:9999px"></div><div style="font-family:'JetBrains Mono',monospace;font-size:10px;color:#A0A0A0">64 · --space-16</div></div>
  </div>
  <div style="font-size:13px;color:#A0A0A0">8pt grid with 4pt half-step. Card padding 20–28px; tap targets ≥ 44px.</div>
</div>
</body></html>
