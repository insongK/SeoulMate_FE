<!doctype html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div class="row">
    <div class="swatch">
      <div class="chip" style="background:#0D0D0D"></div>
      <div class="name">Background</div>
      <div class="meta">--bg · #0D0D0D</div>
    </div>
    <div class="swatch">
      <div class="chip" style="background:#141414"></div>
      <div class="name">BG Elevated</div>
      <div class="meta">--bg-elevated · #141414</div>
    </div>
    <div class="swatch">
      <div class="chip" style="background:#1A1A1A"></div>
      <div class="name">Surface</div>
      <div class="meta">--surface · #1A1A1A</div>
    </div>
    <div class="swatch">
      <div class="chip" style="background:#242424"></div>
      <div class="name">Surface 2</div>
      <div class="meta">--surface-2 · #242424</div>
    </div>
    <div class="swatch">
      <div class="chip" style="background:#2E2E2E"></div>
      <div class="name">Surface 3</div>
      <div class="meta">--surface-3 · #2E2E2E</div>
    </div>
  </div>
  <div class="row">
    <div class="swatch" style="flex:2">
      <div class="chip" style="background-image:url('../assets/seoul-bg.jpg');background-size:cover;background-position:center;position:relative">
        <div style="position:absolute;inset:0;background:linear-gradient(to right,rgba(13,13,13,.94) 0%,rgba(13,13,13,.55) 65%,rgba(13,13,13,.2) 100%)"></div>
      </div>
      <div class="name">Image Overlay (left-heavy)</div>
      <div class="meta">over /assets/seoul-bg.jpg</div>
    </div>
    <div class="swatch" style="flex:1">
      <div class="chip" style="background:#1A1A1A;display:flex;align-items:center;justify-content:center">
        <div style="width:60%;height:60%;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);backdrop-filter:blur(12px);border-radius:10px"></div>
      </div>
      <div class="name">Glass Surface</div>
      <div class="meta">rgba(255,255,255,.04) + blur(24px)</div>
    </div>
  </div>
</div>
</body></html>
