<!doctype html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div class="row">
    <div class="swatch">
      <div class="chip" style="background:#F5A623;border-color:transparent;box-shadow:var(--glow-amber)"></div>
      <div class="name">Morning Amber</div>
      <div class="meta">--primary · #F5A623</div>
    </div>
    <div class="swatch">
      <div class="chip" style="background:#FFC56B;border-color:transparent"></div>
      <div class="name">Amber Soft</div>
      <div class="meta">--primary-soft · #FFC56B</div>
    </div>
    <div class="swatch">
      <div class="chip" style="background:#C8830F;border-color:transparent"></div>
      <div class="name">Amber Deep</div>
      <div class="meta">--primary-deep · #C8830F</div>
    </div>
  </div>
  <div class="row">
    <div class="swatch">
      <div class="chip" style="background:#E8547A;border-color:transparent;box-shadow:var(--glow-pink)"></div>
      <div class="name">Blush Pink</div>
      <div class="meta">--accent · #E8547A</div>
    </div>
    <div class="swatch">
      <div class="chip" style="background:#F386A2;border-color:transparent"></div>
      <div class="name">Pink Soft</div>
      <div class="meta">--accent-soft · #F386A2</div>
    </div>
    <div class="swatch">
      <div class="chip" style="background:#B73B5E;border-color:transparent"></div>
      <div class="name">Pink Deep</div>
      <div class="meta">--accent-deep · #B73B5E</div>
    </div>
  </div>
</div>
</body></html>
