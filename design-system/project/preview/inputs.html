<!doctype html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div class="col" style="gap:6px">
    <label style="font-size:12px;font-weight:500;letter-spacing:.05em;color:#A0A0A0">이메일</label>
    <input value="hello@seoulmate.kr" style="height:52px;padding:0 18px;background:rgba(245,166,35,.07);border:1.5px solid #F5A623;border-radius:14px;color:#FFFFFF;font-family:inherit;font-size:15px;outline:none;box-shadow:0 0 0 4px rgba(245,166,35,.13)" />
  </div>
  <div class="col" style="gap:6px">
    <label style="font-size:12px;font-weight:500;letter-spacing:.05em;color:#A0A0A0">지역</label>
    <input placeholder="강남, 연남, 성수 …" style="height:52px;padding:0 18px;background:rgba(255,255,255,.05);border:1.5px solid rgba(255,255,255,.09);border-radius:14px;color:#FFFFFF;font-family:inherit;font-size:15px;outline:none" />
  </div>
  <div class="col" style="gap:8px">
    <label style="font-size:12px;font-weight:500;letter-spacing:.05em;color:#A0A0A0">예산 ₩60,000 — ₩120,000</label>
    <div style="position:relative;height:8px;background:#242424;border-radius:9999px">
      <div style="position:absolute;left:18%;right:32%;top:0;bottom:0;background:linear-gradient(90deg,#F5A623,#E8547A);border-radius:9999px"></div>
      <div style="position:absolute;left:18%;top:50%;transform:translate(-50%,-50%);width:20px;height:20px;border-radius:50%;background:#FFFFFF;box-shadow:0 2px 8px rgba(0,0,0,.5)"></div>
      <div style="position:absolute;left:68%;top:50%;transform:translate(-50%,-50%);width:20px;height:20px;border-radius:50%;background:#FFFFFF;box-shadow:0 2px 8px rgba(0,0,0,.5)"></div>
    </div>
  </div>
</div>
</body></html>
