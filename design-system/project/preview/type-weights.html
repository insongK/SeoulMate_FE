<!doctype html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">

    <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="font-size:24px;font-weight:200">가</div><div style="font-family:'JetBrains Mono',monospace;font-size:10px;color:#A0A0A0">200</div></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="font-size:24px;font-weight:300">가</div><div style="font-family:'JetBrains Mono',monospace;font-size:10px;color:#A0A0A0">300</div></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="font-size:24px;font-weight:400">가</div><div style="font-family:'JetBrains Mono',monospace;font-size:10px;color:#A0A0A0">400</div></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="font-size:24px;font-weight:500">가</div><div style="font-family:'JetBrains Mono',monospace;font-size:10px;color:#A0A0A0">500</div></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="font-size:24px;font-weight:600">가</div><div style="font-family:'JetBrains Mono',monospace;font-size:10px;color:#A0A0A0">600</div></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="font-size:24px;font-weight:700">가</div><div style="font-family:'JetBrains Mono',monospace;font-size:10px;color:#A0A0A0">700</div></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="font-size:24px;font-weight:800">가</div><div style="font-family:'JetBrains Mono',monospace;font-size:10px;color:#A0A0A0">800</div></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="font-size:24px;font-weight:900">가</div><div style="font-family:'JetBrains Mono',monospace;font-size:10px;color:#A0A0A0">900</div></div>
  </div>
  <div style="display:flex;justify-content:space-between;align-items:baseline">
    <div style="font-size:14px;color:#FFFFFF">Pretendard Variable</div>
    <div style="font-family:'JetBrains Mono',monospace;font-size:11px;color:#A0A0A0">한글 · Latin · 100–900</div>
  </div>
</div>
</body></html>
