<!doctype html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:12px;align-items:center">
    <div style="font-size:48px;font-weight:900;line-height:1;letter-spacing:-2px;background:linear-gradient(135deg,#F5A623 0%,#E8547A 100%);-webkit-background-clip:text;background-clip:text;color:transparent">SeoulMate</div>
    <div style="background:#1A1A1A;border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:10px;border:1px solid rgba(255,255,255,.06)">
      <div style="width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,#F5A623,#E8547A);display:flex;align-items:center;justify-content:center;color:#1A1A1A;font-weight:900;font-size:18px">S</div>
      <div style="font-size:18px;font-weight:800;color:#FFFFFF;letter-spacing:-.5px">SeoulMate</div>
    </div>
  </div>
  <div style="display:flex;align-items:center;gap:18px">
    <div style="font-size:24px;font-weight:800;background:linear-gradient(135deg,#F5A623,#E8547A);-webkit-background-clip:text;background-clip:text;color:transparent">SeoulMate</div>
    <div style="font-size:14px;font-weight:700;color:#FFFFFF">SeoulMate</div>
    <div style="font-family:'JetBrains Mono',monospace;font-size:11px;color:#A0A0A0;margin-left:auto">wordmark · Pretendard 800/900 · -.5/-2 px</div>
  </div>
</div>
</body></html>
