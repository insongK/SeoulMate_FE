<!doctype html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div class="row" style="gap:18px">
    <div class="col" style="align-items:center;flex:1">
      <div style="width:96px;height:96px;background:#1A1A1A;border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.40),0 2px 6px rgba(0,0,0,.30)"></div>
      <div style="font-family:'JetBrains Mono',monospace;font-size:10px;color:#A0A0A0;text-align:center">card · 8/24 + 2/6</div>
    </div>
    <div class="col" style="align-items:center;flex:1">
      <div style="width:96px;height:96px;background:#F5A623;border-radius:14px;box-shadow:0 0 24px rgba(245,166,35,.35),0 0 60px rgba(245,166,35,.12)"></div>
      <div style="font-family:'JetBrains Mono',monospace;font-size:10px;color:#A0A0A0;text-align:center">glow-amber</div>
    </div>
    <div class="col" style="align-items:center;flex:1">
      <div style="width:96px;height:96px;background:#E8547A;border-radius:14px;box-shadow:0 0 24px rgba(232,84,122,.30),0 0 60px rgba(232,84,122,.10)"></div>
      <div style="font-family:'JetBrains Mono',monospace;font-size:10px;color:#A0A0A0;text-align:center">glow-pink</div>
    </div>
    <div class="col" style="align-items:center;flex:1">
      <div style="width:96px;height:96px;background:#1A1A1A;border-radius:14px;box-shadow:inset 0 1px 2px rgba(0,0,0,.4);border:1px solid var(--border)"></div>
      <div style="font-family:'JetBrains Mono',monospace;font-size:10px;color:#A0A0A0;text-align:center">pressed (inset)</div>
    </div>
  </div>
  <div style="font-size:13px;color:#A0A0A0">Outer shadows are kept dim (the page is already dark). Glow only on brand-fill CTAs and the wordmark.</div>
</div>
</body></html>
