<!doctype html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div class="row">
    <div class="swatch">
      <div class="chip" style="background:#34C77B"></div>
      <div class="name">Success</div>
      <div class="meta">#34C77B · 여유</div>
    </div>
    <div class="swatch">
      <div class="chip" style="background:#F5A623"></div>
      <div class="name">Warning</div>
      <div class="meta">#F5A623 · 보통</div>
    </div>
    <div class="swatch">
      <div class="chip" style="background:#E8547A"></div>
      <div class="name">Danger</div>
      <div class="meta">#E8547A · 혼잡</div>
    </div>
    <div class="swatch">
      <div class="chip" style="background:#5BA8FF"></div>
      <div class="name">Info</div>
      <div class="meta">#5BA8FF</div>
    </div>
    <div class="swatch">
      <div class="chip" style="background:#FEE500"></div>
      <div class="name">Kakao</div>
      <div class="meta">#FEE500 · OAuth</div>
    </div>
  </div>
  <div class="row" style="gap:8px">
    <div style="padding:6px 12px;border-radius:9999px;background:rgba(52,199,123,.12);color:#34C77B;font-size:12px;font-weight:600">● 여유</div>
    <div style="padding:6px 12px;border-radius:9999px;background:rgba(245,166,35,.14);color:#F5A623;font-size:12px;font-weight:600">● 보통</div>
    <div style="padding:6px 12px;border-radius:9999px;background:rgba(232,84,122,.14);color:#E8547A;font-size:12px;font-weight:600">● 혼잡</div>
    <div style="padding:6px 12px;border-radius:9999px;background:rgba(91,168,255,.14);color:#5BA8FF;font-size:12px;font-weight:600">정보</div>
  </div>
</div>
</body></html>
